name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: unittest · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile validador_formulario.py

      - name: Run unittest suite
        run: python -m unittest discover -v
